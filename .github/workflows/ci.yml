name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
